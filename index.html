<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1c16">
  <meta name="description" content="You’re invited to our Christmas celebration. Check back for event details and the RSVP form.">
  <title>Christmas Celebration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      --form-font: "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #0b1c16;
      color: #fff7e7;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 100svh;
      padding: clamp(1.5rem, 7vw, 8rem);
      background: #0b1c16;
    }

    picture, picture img, .snow, main::after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    picture { z-index: -3; }
    picture img { object-fit: contain; object-position: right center; }
    .snow {
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .snow::before, .snow::after {
      content: '';
      position: absolute;
      inset: -20rem 0 0;
      background-image:
        radial-gradient(circle at 15% 30%, #fff9ecb8 0 .08rem, transparent .14rem),
        radial-gradient(circle at 61% 62%, #fff9ec83 0 .06rem, transparent .12rem),
        radial-gradient(circle at 80% 14%, #fff9ec95 0 .09rem, transparent .16rem),
        radial-gradient(circle at 29% 86%, #fff9ec6b 0 .06rem, transparent .12rem);
      background-size: 16rem 20rem;
      animation: fall 22s linear infinite;
    }

    .snow::after {
      background-size: 21rem 20rem;
      background-position: 6rem 7rem;
      opacity: .53;
      animation-duration: 34s;
      animation-delay: -13s;
    }

    @keyframes fall {
      to { transform: translateY(20rem); }
    }

    main::after {
      content: '';
      z-index: -1;
      background: linear-gradient(90deg, #0b1c16 0%, #0b1c16d9 28%, #0b1c1630 60%, transparent 82%);
    }

    .invitation {
      width: min(100%, 37rem);
      padding-block: 2rem;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: #f3ce84;
      font-size: 1.4rem;
      margin-block-end: 1rem;
    }

    .ornament::before, .ornament::after {
      content: '';
      width: 2.75rem;
      height: 1px;
      background: #f3ce8480;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.3rem, 7vw, 7rem);
      letter-spacing: -.055em;
      line-height: .93;
      margin: 0;
    }

    h1 em { color: #f3ce84; font-weight: inherit; }

    p {
      color: #ecdfca;
      font-size: clamp(1rem, 1.55vw, 1.25rem);
      line-height: 1.6;
      max-width: 26rem;
      margin: 1.5rem 0;
    }

    dl {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem 2rem;
      margin: 0 0 1.5rem;
    }

    dt {
      color: #f3ce84;
      font-size: .875rem;
      font-weight: 700;
    }

    dd { margin: .25rem 0 0; color: #fff7e7; }

    .rsvp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      padding: .65rem 1.35rem;
      border: 1px solid #f3ce84;
      border-radius: .25rem;
      background: #f3ce84;
      color: #182019;
      font-weight: 700;
      text-decoration: none;
    }

    .rsvp:enabled { cursor: pointer; }
    .rsvp:enabled:hover { background: #ffe4ad; }
    :focus-visible { outline: 2px solid #fff7e7; outline-offset: 3px; }

    form {
      max-width: 29rem;
      padding: clamp(1rem, 4vw, 1.5rem);
      background: #10261ef2;
      border: 1px solid #f3ce8466;
      border-radius: .5rem;
      font-family: var(--form-font);
    }

    h2 {
      margin: 0 0 .8rem;
      font: 400 1.75rem Georgia, "Noto Sans SC", serif;
    }

    fieldset { display: grid; gap: .8rem; padding: 0; margin: 0; border: 0; min-width: 0; }
    label { display: grid; gap: .3rem; font-size: .9rem; font-weight: 600; }
    .attendance { display: grid; grid-template-columns: 3fr 2fr; gap: .8rem; }

    input, select {
      width: 100%;
      min-height: 2.75rem;
      padding: .5rem;
      border: 1px solid #b8a57d;
      border-radius: .25rem;
      background: #091c15;
      color: #fff7e7;
      font: inherit;
      font-size: 1rem;
    }

    input:disabled { opacity: .68; }
    .rsvp { font-family: inherit; font-size: 1rem; }

    .background-music {
      display: grid;
      gap: .35rem;
      margin-top: 1.25rem;
      font-size: .875rem;
    }

    .background-music audio {
      width: 100%;
      max-width: 20rem;
    }

    @media (max-width: 730px) {
      main {
        align-items: start;
        padding: clamp(19rem, 50svh, 31rem) 1.5rem 2rem;
      }
      picture, .snow { height: clamp(22rem, 58svh, 35rem); }
      picture img { object-fit: cover; object-position: center top; }
      main::after {
        background: linear-gradient(
          to bottom,
          transparent 15rem,
          #0b1c1699 clamp(19rem, 50svh, 31rem),
          #0b1c16 clamp(22rem, 58svh, 35rem)
        );
      }
      .invitation { padding-block: 0 1rem; }
      h1 { font-size: clamp(3.1rem, 11vw, 5rem); }
      p { margin-block: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <picture>
      <source media="(max-width: 730px)" srcset="christmas-tree-portrait.webp">
      <img src="christmas-tree.webp" alt="A Christmas tree decorated with warm fairy lights and red and gold ornaments">
    </picture>
    <div class="snow" aria-hidden="true"></div>
    <section class="invitation" aria-labelledby="event-title">
      <div class="ornament" aria-hidden="true">✦</div>
      <h1 id="event-title">Christmas<br><em>Celebration</em></h1>
      <p>You’re invited to celebrate Christmas with us. We’d love to see you there!</p>
      <dl>
        <div>
          <dt>Date and time</dt>
          <dd>To be announced</dd>
        </div>
        <div>
          <dt>Venue</dt>
          <dd>To be announced</dd>
        </div>
      </dl>
      <form id="rsvp-form" method="post" action="https://script.google.com/macros/s/AKfycbyk-vfcuSWeAaSet4oLcAoEDI5P3Q6wUb6VD6hzZc4o7NgjhqpSy3WuxLPoVSYt5tCy/exec" aria-labelledby="rsvp-title">
        <h2 id="rsvp-title">RSVP</h2>
        <fieldset>
          <input type="hidden" name="submissionId">
          <label>Your name
            <input name="guestName" autocomplete="name" maxlength="100" required>
          </label>
          <label>Email (optional)
            <input type="email" name="email" autocomplete="email" maxlength="254">
          </label>
          <div class="attendance">
            <label>Will you attend?
              <select name="attendance" required>
                <option value="" selected disabled>Select one</option>
                <option value="yes">Yes, I’ll attend</option>
                <option value="no">No, I can’t attend</option>
              </select>
            </label>
            <label>Party size
              <input type="number" name="partySize" min="1" step="1" value="1" required>
            </label>
          </div>
          <button class="rsvp" type="submit">Send RSVP</button>
        </fieldset>
      </form>
      <div class="background-music">
        <span id="background-music-label">Background music · Jingle Bells</span>
        <audio src="assets/jingle-bells.mp3" controls loop preload="none" aria-labelledby="background-music-label"></audio>
      </div>
    </section>
  </main>
  <script>
    const form = document.getElementById('rsvp-form');
    const { attendance, partySize, submissionId } = form.elements;

    function updatePartySize() {
      partySize.disabled = attendance.value === 'no';
    }

    attendance.addEventListener('change', updatePartySize);
    window.addEventListener('pageshow', updatePartySize);
    form.addEventListener('submit', () => {
      submissionId.value ||= crypto.randomUUID();
    });
  </script>
</body>
</html>
